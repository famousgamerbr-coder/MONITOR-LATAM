name: Atualizar Precos Automático

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências necessárias
        run: |
          pip install requests

      - name: Executar script de atualização de preços
        run: python atualizar_preco.py

      - name: Enviar alterações automaticamente para o GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add preco_anterior.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática de preços LATAM" && git push)
