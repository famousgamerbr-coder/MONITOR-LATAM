name: Atualizar Preços LATAM

on:
  workflow_dispatch: # Permite o botão manual que já tem no site
  schedule:
    - cron: '0 * * * *' # Roda a cada 1 hora, de hora em hora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Robô de Pesquisa
        run: python atualizar_preco.py # Substitua pelo nome do seu script python

      - name: Guardar Alterações no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática de preços" && git push)
